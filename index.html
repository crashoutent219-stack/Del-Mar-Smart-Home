<style>
:root{color-scheme:dark;--bg:#081321;--side:#0a182b;--card:#12243b;--panel:#102138;--line:#263b52;--text:#e7f1ff;--muted:#8fa5bf;--accent:#8ac5ff;--accent2:#3678be;--green:#83e8c0;--red:#ff8c91;--gold:#c9ac77}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #89caff;outline-offset:2px}.layout{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.sidebar{background:linear-gradient(160deg,#091729,#10243d);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:20px}.brand{padding:10px 12px 13px;border-bottom:1px solid var(--line)}.eyebrow{text-transform:uppercase;letter-spacing:2.5px;font-size:10px;color:var(--accent);font-weight:700}.brand h1{font-size:21px;letter-spacing:2px;margin:9px 0 4px;line-height:1.25}.brand small{color:var(--muted);letter-spacing:1.8px;font-size:9px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:#b5c9de;border-radius:9px;padding:12px;text-align:left;display:flex;align-items:center;gap:12px}.nav button.active{background:#213e60;border-color:#355579;color:white}.nav svg,.nav button span{width:18px;height:18px;flex-shrink:0}.badge-mode{margin-top:auto;background:#13273f;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;color:#9eb8d3}.badge-mode strong{display:block;color:#e6d49d;letter-spacing:1px;font-size:10px;margin-bottom:5px}.main{padding:26px 30px;max-width:1510px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.topbar h2{margin:4px 0 0;font-size:27px;font-weight:560;letter-spacing:.2px}.topbar .right{color:var(--muted);font-size:11px;text-align:right}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d3b379;margin-right:5px}.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(150deg,#132842,#101f34);border:1px solid var(--line);border-radius:14px;padding:21px;min-width:0}.card h3{margin:0 0 15px;font-weight:600;font-size:16px;letter-spacing:.3px}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1.15px;color:var(--muted)}.kpi{font-size:28px;font-weight:600;margin:10px 0 4px;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--accent)}.gold{color:var(--gold)}.section-title{margin:23px 0 13px;font-weight:600;font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.btn{background:#234264;border:1px solid #426286;color:#eff6ff;border-radius:9px;padding:11px 14px;font-weight:580}.btn:hover{filter:brightness(1.13)}.btn.primary{background:linear-gradient(120deg,#3178bb,#245995);border-color:#5898d7}.btn.ghost{background:transparent;color:#bcd0e8}.btn.warn{background:#53303b;border-color:#8c4559}.btn.active{background:#366a9d;color:white}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-label{display:block;color:#b8ccdf;margin-bottom:8px;font-size:12px}.field{width:100%;background:#0c1b2e;border:1px solid #355171;color:#edf7ff;border-radius:9px;padding:12px;outline:none}.field:focus{border-color:var(--accent)}.field option{background:#142840}.range{width:100%;accent-color:#75bafd;cursor:pointer}.divider{height:1px;background:var(--line);margin:17px 0}.chip-grid{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#122b45;color:#a9c5df;border:1px solid #34506e;border-radius:8px;padding:9px 12px}.chip.selected{border-color:#a5d9ff;color:#fff;background:#285787}.swatch{width:28px;height:28px;border:2px solid #4a6278;border-radius:50%;display:inline-block}.swatch.selected{outline:2px solid #cae8ff;outline-offset:3px}.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:17px;margin:15px 0}.switch{position:relative;display:inline-block;width:45px;height:25px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#3b4b61;border-radius:20px;cursor:pointer}.slider:before{content:'';position:absolute;left:4px;top:4px;width:17px;height:17px;border-radius:50%;background:white;transition:transform .2s}.switch input:checked+.slider{background:#2f8ac6}.switch input:checked+.slider:before{transform:translateX(20px)}.notice{padding:12px 15px;border:1px solid #576145;border-radius:9px;background:#2d3025;color:#e0daaf;font-size:12px}.info{padding:12px 15px;border:1px solid #355575;border-radius:9px;background:#102e4b;color:#bfdbf5;font-size:12px}.room-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.room-header h3{font-size:20px;margin:0}.device-tile{background:#10263e;border:1px solid var(--line);border-radius:10px;padding:17px}.device-tile h4{margin:0 0 5px}.statline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.statline:last-child{border:0}.list{display:grid;gap:8px}.log{background:#091929;border:1px solid var(--line);border-radius:9px;padding:12px;min-height:95px;max-height:160px;overflow:auto;font-size:12px;color:#b4d1e7;white-space:pre-line}.footer{color:#6f8aa7;font-size:10px;margin-top:22px;text-align:center}.toast{position:fixed;bottom:22px;right:22px;background:#254565;color:white;border:1px solid #5483ac;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px #0008;display:none;z-index:5}.help{color:#8fa5bf;font-size:11px;margin:7px 0}.link{color:#a4cbff}.page{animation:fade .18s ease-in}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{padding:13px}.brand{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{padding:8px 12px;white-space:nowrap}.badge-mode{display:none}.main{padding:16px}.topbar h2{font-size:22px}.four{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.two,.three,.four{grid-template-columns:1fr}.card{padding:16px}.topbar{align-items:start}.topbar .right{max-width:130px}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar"><div class="brand"><div class="eyebrow">Wasabi Estates</div><h1>DEL MAR</h1><small>SMART RESIDENCE</small></div><nav class="nav" id="nav"></nav><div class="badge-mode" id="mode"><strong>● SETUP REQUIRED</strong>Connect the Cloudflare Worker in Settings to control the house.</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Wasabi Estates · Del Mar Mansion</div><h2 id="pageTitle">Home Overview</h2></div><div class="right" id="topstatus"><span class="pulse"></span>NOT CONNECTED<br>18 room zones</div></header><section id="content" class="page" aria-live="polite"></section><footer class="footer">WASABI ESTATES · Nothing is bigger than the brand · Cloudflare Beta v6.2 · Owner-browser testing only</footer></main></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const ROOMS=[...Array.from({length:6},(_,i)=>({id:'bed'+(i+1),name:'Bedroom '+(i+1),type:'Bedrooms'})),...Array.from({length:5},(_,i)=>({id:'bath'+(i+1),name:'Bathroom '+(i+1),type:'Bathrooms'})),{id:'garage',name:'Garage',type:'Other'},{id:'kitchen',name:'Kitchen',type:'Living Areas'},{id:'dining',name:'Dining Room',type:'Living Areas'},{id:'living',name:'Living Room',type:'Living Areas'},{id:'hall1',name:'Hallway 1',type:'Living Areas'},{id:'hall2',name:'Hallway 2',type:'Living Areas'},{id:'exterior',name:'Exterior',type:'Other'}];
const PAGES=[['Home','⌂'],['Lights','◉'],['Fans','✺'],['Pool','≋'],['Projector','▣'],['Fireplace','♨'],['Cleaning','✦'],['Security','⬡'],['Doorbell','♧'],['Settings','⚙']];
const PALETTE=[['Warm White','#FFDF9F'],['Cool White','#EAF5FF'],['Blue','#6AAFFF'],['Purple','#BD91FF'],['Red','#FF8790'],['Green','#8DE7B6']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(label,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${esc(action)}">${esc(label)}</button>`;
const toggle=(checked,action)=>`<label class="switch"><input type="checkbox" data-action="${esc(action)}" ${checked?'checked':''}><span class="slider"></span></label>`;
let page='Home',room='living',fanRoom='living',connected=false,online=false,house=null,visits=[],historyExtra=[],hasMore=true,notice='',working=false;
const WORKER_URL='https://wasabi-smart-home-beta.crashoutsecondlife.workers.dev';
let endpoint=WORKER_URL,houseID='',secret='';
// Do NOT persist the full-control access key in sessionStorage/localStorage on shared media.
const defaultRoom=id=>ROOMS.find(r=>r.id===id)?.name||id;
const defaultState=()=>({house:'',rooms:Object.fromEntries(ROOMS.map(r=>[r.id,{name:r.name,on:'1',brightness:'75',color:'#FFDF9F',fan:'OFF',clean:'100'}])),security:{armed:'0',lockdown:'0',silent:'0',kick:'30'},pool:'RAISED',projector:{texture:'',power:'0',spin:'0'},fireplace:{power:'0',sound:''},doorbellSound:'',windowClean:'100',cleaning:'1',pestCount:'0'});
let st=defaultState();
function val(b){return b===true||b==='1'||b===1;}
function roomData(id){return st.rooms?.[id]||{name:defaultRoom(id),on:'0',brightness:'75',color:'#FFDF9F',fan:'OFF',clean:'100'};}
function roomName(id){return roomData(id).name||defaultRoom(id);}
function notify(s){notice=s;$('toast').textContent=s;$('toast').style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').style.display='none',3600);}
function url(){return endpoint.trim().replace(/\/+$/,'');}
function auth(){return {'X-House-ID':houseID,'X-House-Key':secret};}
function statusLabel(){return !connected?'NOT CONNECTED':online?'HOUSE ONLINE':'BRIDGE LINKED · HOUSE OFFLINE';}
async function query(path,opt={}){
 if(!endpoint||!houseID||!secret)throw Error('Connect your mansion in Settings first.');
 const response=await fetch(url()+path,{cache:'no-store',...opt,headers:{...auth(),...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});
 const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Bridge error '+response.status);return data;
}
async function refresh(){
 if(!endpoint||!houseID||!secret)return;
 try{
  const result=await query('/api/state');
  if(result.ok){st={...defaultState(),...result.state};visits=result.visitors||[];connected=true;online=!!result.online;if(!document.activeElement?.matches('input,select'))render();}
 }catch(e){connected=false;online=false;render();if(!working)notify(e.message);}
}
async function command(action,r='',value=''){
 if(!connected){notify('Connect to your house before controlling devices.');return;}
 if(!online){notify('House is offline. Command may queue but will not act until it reconnects.');}
 try {working=true;await query('/api/command',{method:'POST',body:JSON.stringify({action,room:r,value:String(value)})});notify('Command queued by Cloudflare. Wait about 30 seconds, then verify the device changes in Second Life.');}
 catch(e){notify('Command not sent: '+e.message);}finally{working=false;}
}
function nav(){
 $('nav').innerHTML=PAGES.map(([name,ico])=>`<button data-page="${name}" class="${page===name?'active':''}"><span>${ico}</span>${name}</button>`).join('');
 const left=$('mode');if(left)left.innerHTML=`<strong>${connected?(online?'● HOUSE ONLINE':'● HOUSE OFFLINE'):'● SETUP REQUIRED'}</strong>${connected?'Each in-world device receives its own mansion ID.':'Website alone cannot control in-world objects. Open Settings → Connect House.'}`;
 const right=$('topstatus');if(right)right.innerHTML=`<span class="pulse" style="background:${(connected&&online)?'#63dbad':'#d3b379'}"></span> ${connected?(online?'HOUSE ONLINE':'BRIDGE LINKED · HOUSE OFFLINE'):'NOT CONNECTED'}<br>18 room zones · ${esc(houseID?houseID.slice(0,8):'No house selected')}`;
 $('pageTitle').textContent=(page==='Home'?'Home Overview':page==='Settings'?'Mansion Settings':page==='Lights'?'Lighting Groups':page==='Fans'?'Ceiling Fans':page==='Pool'?'Pool Cover':page==='Projector'?'Projector Studio':page==='Cleaning'?'Cleaning & Maintenance':page==='Security'?'Wasabi Security':page==='Doorbell'?'Visitor Log':'Fireplace');
}
function percent(){const scores=ROOMS.map(r=>Number(roomData(r.id).clean??100));scores.push(Number(st.windowClean??100));return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);}
function securityWord(){return !val(st.security.armed)?'DISARMED':val(st.security.lockdown)?'LOCKDOWN':'ARMED';}
function home(){const on=ROOMS.filter(r=>val(roomData(r.id).on)).length;return `<div class="grid four">
 <div class="card"><div class="kpi-label">House Cleanliness</div><div class="kpi green">${connected?percent()+'%':'—'}</div><div class="sub">Measured across rooms + windows</div></div>
 <div class="card"><div class="kpi-label">Security</div><div class="kpi ${val(st.security.armed)?'green':'gold'}">${connected?securityWord():'—'}</div><div class="sub">${connected?(online?'Live house status':'Last saved status — house offline'):'Disconnected'}</div></div>
 <div class="card"><div class="kpi-label">Lighting</div><div class="kpi">${connected?on+' / 18':'— / 18'}</div><div class="sub">Zones switched on</div></div>
 <div class="card"><div class="kpi-label">Pool Cover</div><div class="kpi blue">${connected?esc(st.pool):'—'}</div><div class="sub">Last reported motor status</div></div>
 </div><div class="grid two" style="margin-top:18px">
 <div class="card"><h3>House Lighting</h3><p class="sub">One touch control across 18 zones.</p>${mk('All Lights On','all:1','primary')} ${mk('All Lights Off','all:0')}</div>
 <div class="card"><h3>Pool & Security</h3>${mk('Raise Pool','pool:RAISE')} ${mk('Lower Pool','pool:LOWER','primary')} ${mk('Disarm Security','sec:0','warn')} ${mk('Arm Security','sec:1')}</div>
 </div><div class="card" style="margin-top:18px"><h3>Home Services</h3><div class="statline"><span>Cleaning requirement</span><strong>${val(st.cleaning)?'ON':'OFF'}</strong></div><div class="statline"><span>Pest activity</span><strong>${esc(st.pestCount||'0')} active reported</strong></div><div class="statline"><span>Projector</span><strong>${val(st.projector.power)?'ON':'OFF'}</strong></div><div class="statline"><span>Fireplace</span><strong>${val(st.fireplace.power)?'ON':'OFF'}</strong></div><div class="statline"><span>Visitor entries in past week</span><strong>${visits.length}</strong></div></div>`;}
function selector(which){const chosen=which==='fan'?fanRoom:room;return `<select class="field" data-select="${which}">${ROOMS.map(r=>`<option value="${r.id}" ${r.id===chosen?'selected':''}>${esc(roomName(r.id))}</option>`).join('')}</select>`;}
function lights(){const r=roomData(room);return `<div class="grid two"><div class="card stack"><h3>18 Customizable Rooms</h3>${selector('room')}<label class="field-label" for="roomName">Displayed Room Name</label><input id="roomName" maxlength="32" class="field" value="${esc(roomName(room))}" placeholder="Master Suite">${mk('Save Room Name','name:save','primary')} ${mk('Restore Default Name','name:reset','ghost')}<div class="divider"></div><h3>Pair Fixtures</h3><div class="info">Click Pair Fixtures, then owner-touch every fixture you want assigned to ${esc(roomName(room))}. Pairing expires after 60 seconds. Room assignments and group channels persist after resets.</div>${mk('Pair Fixtures to This Room','pair:LIGHT','primary')}</div>
 <div class="card stack"><div class="row"><h3>${esc(roomName(room))} Lighting</h3>${toggle(val(r.on),'light:power')}</div><div class="row"><span>Brightness</span><strong id="brightnessValue">${esc(r.brightness)}%</strong></div><input type="range" class="range" min="0" max="100" step="5" value="${esc(r.brightness)}" data-range="brightness"><span class="field-label">Color Presets</span><div class="swatches">${PALETTE.map(([n,v])=>`<button title="${esc(n)}" aria-label="${esc(n)}" data-color="${v}" class="swatch ${r.color?.toUpperCase()===v?'selected':''}" style="background:${v}"></button>`).join('')}</div><label class="field-label">Custom Hex Color</label><div class="row"><input id="customColor" class="field" style="width:65%" value="${esc(r.color)}" placeholder="#FFDF9F">${mk('Apply Color','color:custom','primary')}</div><div class="sub">Fixtures paired to the room share a unique house + zone channel. Changing the room's display name will not change its channel.</div></div></div>`;}
function fans(){const r=roomData(fanRoom);return `<div class="grid two"><div class="card stack"><h3>Fan Room</h3>${selector('fan')}<div style="font-size:60px;text-align:center;color:#8ac5ff">✺</div><div class="kpi" style="text-align:center">${esc(r.fan||'OFF')}</div><div class="sub" style="text-align:center">${esc(roomName(fanRoom))}</div>${mk('Pair Fan to This Room','pair:FAN','primary')}<div class="info">Click Pair Fan, then owner-touch the rotating fan motor/blades prim. Add the optional Fan Sound asset to play a motor sound.</div></div><div class="card"><h3>Motor Speed</h3><div class="control-grid">${mk('ON','fan:ON','primary')}${['OFF','LOW','MEDIUM','HIGH'].map(v=>mk(v,'fan:'+v,r.fan===v?'primary':'')).join('')}</div><div class="divider"></div><p class="sub">Your existing OFF/LOW/MEDIUM/HIGH speeds and audio were preserved. Every room is individually addressable.</p></div></div>`;}
function pool(){return `<div class="grid two"><div class="card"><h3>Motorized Pool Cover</h3><div style="font-size:68px;color:#8ac5ff;text-align:center">≋</div><div class="kpi blue" style="text-align:center">${esc(st.pool)}</div><p class="sub">Builder-fixed 5-meter drop over 12 seconds; returns to its saved raised position. No customer calibration required.</p></div><div class="card stack"><h3>Controls</h3><div class="control-grid">${mk('↑ Raise','pool:RAISE','primary')}${mk('↓ Lower','pool:LOWER','primary')}${mk('■ Stop','pool:STOP')}${mk('↻ Auto Cycle','pool:CYCLE')}</div>${mk('Pair Motor','pair:POOL')}<div class="notice">Builder-configured 5-meter travel. Customers only use Raise, Lower, Stop or Auto Cycle. Motor must be paired in-world for these controls to work.</div></div></div>`;}
function projector(){return `<div class="grid two"><div class="card stack"><h3>Projector Image</h3><label class="field-label">Second Life Texture UUID</label><input class="field" id="projectorTexture" maxlength="36" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" value="${esc(st.projector.texture||'')}">${mk('Apply Texture UUID','projector:texture','primary')} ${mk('Restore Wasabi Logo','projector:logo')}<div class="divider"></div><div class="row"><span>Projector Power</span>${toggle(val(st.projector.power),'projector:power')}</div><div class="row"><span>Spin Projector Emitter</span>${toggle(val(st.projector.spin),'projector:spin')}</div>${mk('Stop Rotation','projector:stop')}</div><div class="card stack"><h3>Projector Device</h3><p class="sub">Your working Wasabi projector v6.1 uses PRIM_PROJECTOR to cast the original Wasabi logo or a customer UUID as projected light. Spin rotates the physical projector emitter, not its surface UV. The mesh and face textures remain unchanged.</p>${mk('Pair Projector','pair:PROJECTOR','primary')}<div class="notice">Only use textures you are allowed to display. The projector must contain the paired LSL receiver script. Keep the working Wasabi projector v6.1 script; do not install old face-texture versions.</div></div></div>`;}
function fireplace(){return `<div class="grid two"><div class="card stack"><h3>Fireplace</h3><div class="kpi gold">${val(st.fireplace.power)?'BURNING':'OFF'}</div><div class="row"><span>Ignite / Extinguish</span>${toggle(val(st.fireplace.power),'fire:power')}</div>${mk('Pair Fireplace','pair:FIRE','primary')}</div><div class="card stack"><h3>Crackling Sound</h3><label class="field-label">Optional Fire Sound UUID</label><input class="field" id="fireSound" maxlength="36" value="${esc(st.fireplace.sound||'')}" placeholder="UUID or leave empty">${mk('Save Sound UUID','fire:sound')}<p class="sub">Your working fireplace v5.6.2 rezzes the original object named Fire above link #3, and removes that object when turned off. The webpage only sends POWER and SOUND commands to that receiver.</p></div></div>`;}
function cleaning(){return `<div class="grid two"><div class="card stack"><h3>Cleaning Requirement</h3><div class="row"><div><div class="kpi green">${percent()}%</div><span class="sub">Overall House Cleanliness</span></div>${toggle(val(st.cleaning),'cleaning:toggle')}</div><div class="info">Turning cleaning OFF prevents dirt accumulation and new pests; it also requests removal of active critters. The existing scores are preserved for when cleaning is turned back on.</div><div class="divider"></div><h3>Housekeeping Actions</h3><p class="sub">Select an action, then stand near and touch a paired floor or window cleaning spot in-world. The avatar must grant animation permissions and remain nearby. Mopping and sweeping share one animation.</p><div class="control-grid">${mk('Mop Floors','clean:MOP','primary')}${mk('Sweep Floors','clean:SWEEP')}${mk('Clean Windows','clean:WINDOW')}${mk('Pair Dirt Spot','pair:CLEAN_ZONE')}</div><label class="field-label">Cleaning spot room</label>${selector('room')}<label class="field-label">Cleaning spot type</label><select class="field" id="zoneKind"><option value="FLOOR">Floor (Mop / Sweep)</option><option value="WINDOW">Window (uses Windows global zone)</option></select></div><div class="card"><h3>Room Cleanliness</h3><div class="list">${ROOMS.map(r=>scoreRow(roomName(r.id),roomData(r.id).clean)).join('')}${scoreRow('Windows (All)',st.windowClean)}</div><div class="divider"></div><div class="row"><span>Pest Activity</span><strong class="${Number(st.pestCount||0)>0?'red':'green'}">${esc(st.pestCount||'0')} tracked</strong></div>${mk('Pair Pest Spawner','pair:PEST')}</div></div>`;}
function scoreRow(n,p){const v=Math.min(100,Math.max(0,Number(p)||0));return `<div class="statline"><span>${esc(n)}</span><span><span style="display:inline-block;vertical-align:middle;width:75px;height:7px;border-radius:5px;background:#203853;margin-right:8px;overflow:hidden"><span style="display:block;height:100%;width:${v}%;background:${v<50?'#f39c8c':v<75?'#f0ce80':'#6bd5a1'}"></span></span>${v}%</span></div>`;}
function security(){const s=st.security;return `<div class="grid two"><div class="card stack"><h3>Security Status</h3><div class="kpi ${val(s.armed)?'green':'gold'}">${securityWord()}</div><div class="control-grid">${mk('ARM','sec:1','primary')}${mk('DISARM','sec:0','warn')}</div><div class="divider"></div><div class="row"><span>Lockdown</span>${toggle(val(s.lockdown),'sec:lockdown')}</div><div class="row"><span>Silent Mode (hide hovertext)</span>${toggle(val(s.silent),'sec:silent')}</div><label class="field-label">Kick Delay</label><select class="field" data-select="kick">${[10,30,60].map(n=>`<option value="${n}" ${String(s.kick)===String(n)?'selected':''}>${n} seconds</option>`).join('')}</select>${mk('Pair Security Device','pair:SECURITY')}<div class="notice">Security only acts within its configured area and when your land permissions allow it. This is not a replacement for parcel access rules.</div></div><div class="card stack"><h3>Access Control</h3><p class="sub">Add residents to the whitelist or grant moderator access. Only someone holding the private house key should be allowed to use this web panel.</p><label class="field-label">Avatar UUID</label><input class="field" id="accessUUID" maxlength="36" placeholder="Avatar UUID"><div class="control-grid">${mk('Allow Resident','sec:wladd')}${mk('Remove Resident','sec:wldel')}${mk('Add Moderator','sec:modadd')}${mk('Remove Moderator','sec:moddel')}</div><div class="divider"></div><p class="sub">Whitelist and moderator UUIDs are saved by the security object itself using Linkset Data.</p></div></div>`;}
function lastWeekLog(){const bound=Date.now()/1000-604800;const seen=new Set();return [...visits,...historyExtra].filter(v=>v.ts>=bound).filter(v=>{if(seen.has(v.id))return false;seen.add(v.id);return true;}).sort((a,b)=>b.id-a.id);}
async function loadMoreVisits(){
 if(!connected)return;
 const all=lastWeekLog();const oldest=all.length?Math.min(...all.map(v=>Number(v.id))):0;
 try{const data=await query('/api/visitors?before='+oldest);historyExtra.push(...data.visitors);hasMore=data.has_more;render();notify('Visitor history loaded.');}
 catch(e){notify(e.message);}
}
function doorbell(){const logs=lastWeekLog();return `<div class="grid two"><div class="card stack"><h3>Custom Doorbell Sound</h3><label class="field-label">Second Life Sound UUID</label><input class="field" id="bellSound" maxlength="36" value="${esc(st.doorbellSound||'')}" placeholder="Sound asset UUID">${mk('Save Doorbell Sound','doorbell:sound','primary')}${mk('Clear Custom Sound','doorbell:clear')}${mk('Pair Doorbell','pair:DOORBELL')}<div class="info">Short touch rings. Long press by the homeowner opens the existing inventory-sound management menu. The website adds a UUID sound option.</div></div><div class="card"><h3>Visitor Activity · Last 7 Days</h3><div class="log" style="max-height:410px;min-height:230px">${logs.length?logs.map(v=>`<div class="statline"><span>${esc(v.kind==='RING'?'🔔 Doorbell':'🏠 Arrival')} · ${esc(v.visitor_name)}</span><time>${esc(new Date(v.ts*1000).toLocaleString())}</time></div>`).join(''):'No visitors reported in the past seven days.'}</div><div class="divider"></div>${hasMore?mk('Load Older Visitor Entries','doorbell:more'): '<span class="sub">All available entries loaded.</span>'}<p class="sub">Only entries from the past seven days are shown; database cleanup runs when events are logged and when the backend cleanup job is scheduled. Counts only visits detected by the house security scanner and rings at its paired doorbell.</p></div></div>`;}
function settings(){return `<div class="grid two"><div class="card stack"><h3>Connect Your Mansion</h3><div class="info">Touch your House Core prim in Second Life → SHOW ID. Your private ID and key are needed only to authorize this specific house.</div><label class="field-label">Cloudflare Worker HTTPS URL</label><input class="field" id="bridgeURL" value="${esc(endpoint)}" placeholder="https://wasabi-smart-home-beta.crashoutsecondlife.workers.dev"><label class="field-label">House ID</label><input class="field" id="houseID" value="${esc(houseID)}" placeholder="UUID from in-world controller"><label class="field-label">Private House Access Key</label><input type="password" class="field" id="houseSecret" placeholder="Enter private key; never upload to GitHub" autocomplete="off">${mk('Connect House','connect','primary')} ${mk('Disconnect Screen','disconnect','ghost')}<div class="divider"></div><div class="statline"><span>House Link</span><strong>${connected?'CONNECTED':'NOT CONNECTED'}</strong></div><p class="sub">The private house key stays in memory only until this page is reloaded. IMPORTANT: During beta testing, connect in a PRIVATE owner-controlled browser; do not enter an owner key on a publicly accessible shared-media wall. The web key currently grants full house control.</p></div><div class="card stack"><h3>House & Ownership</h3><div class="statline"><span>Home zones</span><strong>18 + windows</strong></div><div class="statline"><span>Current House ID</span><strong>${esc(houseID?houseID.slice(0,18)+'…':'Not set')}</strong></div><div class="divider"></div><h3>Cleaning Preference</h3><div class="row"><span>Require cleaning</span>${toggle(val(st.cleaning),'cleaning:toggle')}</div><h3>Multiple Houses</h3><p class="sub">Every separately configured mansion has a unique ID and key. To switch to another Del Mar home, enter its credentials above. If you duplicate an already configured house, owner-touch its House Core and select NEW HOUSE; pair that copy's devices again.</p><div class="notice">Security & doorbell are real only after the Cloudflare bridge, house controller, and corresponding LSL scripts are installed and paired.</div></div></div>`;}
function render(){nav();const pages={Home:home,Lights:lights,Fans:fans,Pool:pool,Projector:projector,Fireplace:fireplace,Cleaning:cleaning,Security:security,Doorbell:doorbell,Settings:settings};$('content').innerHTML=pages[page]();}
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const text=id=>$(id)?.value.trim()||'';
async function act(a){
 if(a==='connect'){
  endpoint=text('bridgeURL').replace(/\/+$/,'');houseID=text('houseID');secret=text('houseSecret')||secret;
  if(!endpoint.startsWith('https://')||!UUID.test(houseID)||!UUID.test(secret)){notify('Enter a valid HTTPS Worker URL, House ID and House Key.');return;}
  historyExtra=[];hasMore=true;/* Never save the house key or house ID to browser storage. */
  await refresh();if(connected){page='Home';render();notify('Connected to Del Mar Mansion');}return;
 }
 if(a==='disconnect'){connected=false;online=false;houseID='';secret='';st=defaultState();visits=[];historyExtra=[];hasMore=true;page='Settings';render();notify('Screen disconnected');return;}
 if(a==='name:save'){const n=text('roomName');if(!n||n.length>32||/[|<>]/.test(n)){notify('Room name must be 1–32 characters, no | < >.');return;}await command('ROOM_NAME',room,n);return;}
 if(a==='name:reset'){await command('ROOM_NAME',room,defaultRoom(room));return;}
 if(a.startsWith('pair:')){const kind=a.slice(5);if(kind==='CLEAN_ZONE'){const kind2=$('zoneKind').value;await command('CLEAN_ZONE_PAIR',kind2==='WINDOW'?'windows':room,kind2);}else await command(kind+'_PAIR',kind==='LIGHT'?room:kind==='FAN'?fanRoom:'','');return;}
 if(a.startsWith('color:')){const v=a==='color:custom'?text('customColor'):a.slice(6);if(!/^#[\da-f]{6}$/i.test(v)){notify('Enter a hex color such as #FFDF9F');return;}await command('LIGHT_COLOR',room,v.toUpperCase());return;}
 if(a.startsWith('fan:')){await command('FAN_SPEED',fanRoom,a==='fan:ON'?'MEDIUM':a.slice(4));return;}
 if(a.startsWith('pool:')){if(a==='pool:home'){await command('POOL_HOME');return;}await command('POOL','',a.slice(5));return;}
 if(a.startsWith('all:')){await command('ALL_LIGHTS','',a.slice(4));return;}
 if(a.startsWith('sec:')){
  const op=a.slice(4);
  if(op==='1'||op==='0'){await command('SEC_ARMED','',op);return;}
  const avatar=text('accessUUID');if(!UUID.test(avatar)){notify('Enter a valid avatar UUID.');return;}
  const map={wladd:'SEC_WL_ADD',wldel:'SEC_WL_DEL',modadd:'SEC_MOD_ADD',moddel:'SEC_MOD_DEL'};
  await command(map[op],'',avatar);return;
 }
 if(a==='projector:texture'){const v=text('projectorTexture');if(!UUID.test(v)){notify('Enter a valid texture UUID.');return;}await command('PROJECTOR_TEXTURE','',v);return;}
 if(a==='projector:stop'){await command('PROJECTOR_SPIN','','0');return;}
 if(a==='projector:logo'){await command('PROJECTOR_TEXTURE','','');return;}
 if(a==='fire:sound'||a==='doorbell:sound'){
  const v=text(a==='fire:sound'?'fireSound':'bellSound');if(v&&!UUID.test(v)){notify('Enter a valid sound UUID or leave blank.');return;}
  await command(a==='fire:sound'?'FIRE_SOUND':'DOORBELL_SOUND','',v);return;
 }
 if(a==='doorbell:clear'){await command('DOORBELL_SOUND','','');return;}
 if(a==='doorbell:more'){await loadMoreVisits();return;}
 if(a.startsWith('clean:')){await command('CLEAN_MODE','',a.slice(6));return;}
}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();return;}
 const color=e.target.closest('[data-color]');if(color){command('LIGHT_COLOR',room,color.dataset.color);return;}
 const button=e.target.closest('[data-action]');if(button && button.tagName==='BUTTON')act(button.dataset.action);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.select==='room'){room=t.value;render();return;}
 if(t.dataset.select==='fan'){fanRoom=t.value;render();return;}
 if(t.dataset.select==='kick'){command('SEC_KICK','',t.value);return;}
 if(t.dataset.range==='brightness'){command('LIGHT_BRIGHT',room,t.value);return;}
 const a=t.dataset.action;
 if(!a)return;
 const map={'light:power':['LIGHT_ON',room],'security:lockdown':['SEC_LOCKDOWN',''],'security:silent':['SEC_SILENT',''],'cleaning:toggle':['CLEAN_ENABLED',''],'projector:power':['PROJECTOR_POWER',''],'projector:spin':['PROJECTOR_SPIN',''],'fire:power':['FIRE_POWER','']};
 if(map[a])command(map[a][0],map[a][1],t.checked?'1':'0');
});
document.addEventListener('input',e=>{if(e.target.dataset.range==='brightness'){const b=$('brightnessValue');if(b)b.textContent=e.target.value+'%';}});
render();if(houseID&&secret&&endpoint)refresh();setInterval(()=>{if(!document.hidden)refresh();},30000);

</script>
</body></html>
